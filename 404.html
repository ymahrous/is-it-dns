<style>
:root{--paper:#EDF0F4;--ink:#172033;--ink-2:#4A5570;--stamp:#D2362B;--term:#172033;--term-ink:#D9E2F2;--hi:#F5C518}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--paper:#0F1522;--ink:#E6EBF5;--ink-2:#9AA6C0;--stamp:#FF5A4B;--term:#0A0F19}}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 20px;background:var(--paper);color:var(--ink);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}

pre b{color:var(--hi)}
a{color:var(--ink);text-decoration-color:var(--stamp);text-underline-offset:3px;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>NXDOMAIN</h1>
  <pre>$ dig this-page
;; ->>HEADER<<- opcode: QUERY, <b>status: NXDOMAIN</b>
